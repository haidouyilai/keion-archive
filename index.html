<title>軽音バンドアーカイブ</title>
<style>
:root{
  --bg:#f6f4ef; --surface:#fffdf9; --surface2:#efe9dd; --text:#2b2620; --muted:#7a7264;
  --border:#ddd5c4; --accent:#b3541e; --accent-soft:#f3e2d3; --chip:#efe9dd;
  --danger:#b3261e; --ok:#3d7a3d;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1d1a16; --surface:#2a251f; --surface2:#352e26; --text:#ece5d8; --muted:#a89c88;
    --border:#4a4234; --accent:#e08a4c; --accent-soft:#4a3421; --chip:#352e26; --danger:#e06a5f; --ok:#7fb87f; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55}
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 14px calc(8px + env(safe-area-inset-top,0px));padding-top:calc(10px + env(safe-area-inset-top,0px));box-shadow:0 2px 10px rgba(0,0,0,.06)}
header h1{font-size:16px;margin:0 0 8px}
nav.tabs{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto}
nav.tabs button{border:1px solid var(--border);background:var(--chip);color:var(--text);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;min-height:38px}
nav.tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
main{max-width:860px;margin:0 auto;padding:14px 14px 120px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card.clickable{cursor:pointer}
.card h3{margin:0 0 4px;font-size:16px}
.meta{color:var(--muted);font-size:13px}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;margin:2px 3px 2px 0}
.chip.accent{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.warn{background:#f6d9d5;color:var(--danger)}
.badge{display:inline-block;border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:0 6px;font-size:11px;margin-left:6px;vertical-align:1px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font-size:16px;margin:4px 0 10px}
textarea{min-height:74px;resize:vertical}
label.flabel{display:block;font-size:13px;color:var(--muted);margin-top:8px}
button.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:10px 14px;font-size:14px;cursor:pointer;min-height:44px}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.btn.danger{color:var(--danger);border-color:var(--danger)}
button.btn.small{min-height:40px;padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 0 auto}
.row .grow{flex:1 1 auto}
.actionbar{position:fixed;bottom:0;left:0;right:0;z-index:30;max-width:860px;margin:0 auto;background:var(--surface);border-top:1px solid var(--border);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.backbar{position:sticky;top:calc(88px + env(safe-area-inset-top,0px));z-index:18;background:var(--bg);padding:8px 0;margin:-4px 0 10px}
ul.plain{list-style:none;padding:0;margin:6px 0}
ul.plain li{padding:7px 0;border-bottom:1px dashed var(--border)}
ul.plain li:last-child{border-bottom:none}
a{color:var(--accent)}
.songnote{color:var(--muted);font-size:12px;margin-left:6px}
.memberrow{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--surface)}
.partchecks{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 8px}
.partchecks label{font-size:14px;display:flex;gap:4px;align-items:center}
.partchecks input{width:18px;height:18px}
details{margin:8px 0}
summary{cursor:pointer;color:var(--accent);font-size:14px;min-height:32px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.notice{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.kbd{font-family:monospace;background:var(--chip);padding:1px 6px;border-radius:5px;font-size:12px}
h2.sec{font-size:16px;margin:18px 0 8px}
.empty{color:var(--muted);text-align:center;padding:26px 0}
</style>
</head>
<body>
<header>
  <h1>軽音バンドアーカイブ</h1>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="app"></main>

/* ================= アプリ本体 ================= */
const LS_KEY = "keion-archive-friends-v1";
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function loadDB(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const d = JSON.parse(raw); if(d && Array.isArray(d.people) && Array.isArray(d.events) && Array.isArray(d.bands)) return d; }
  }catch(e){}
  return { people: clone(SEED_PEOPLE), events: clone(SEED_EVENTS), bands: clone(SEED_BANDS) };
}
let DB = loadDB();
function saveDB(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){ alert("保存できませんでした（容量不足の可能性があります）"); } }
function nextId(coll){ return DB[coll].reduce((m,x)=>Math.max(m,x.id||0),0)+1; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function personByName(name){ return DB.people.find(p=>p.name===name) || null; }
function eventById(id){ return DB.events.find(e=>e.id===id) || null; }
function bandById(id){ return DB.bands.find(b=>b.id===id) || null; }
function acadYearOf(dateStr){ if(!dateStr) return null; const p = String(dateStr).split("-"); if(p.length<2) return null; const y=+p[0], m=+p[1]; return m>=4 ? y : y-1; }
function nowAcad(){ const d=new Date(); return d.getMonth()+1>=4 ? d.getFullYear() : d.getFullYear()-1; }
function programYears(p){ if(p.programYears) return p.programYears; if(p.department==="医学科") return 6; if(p.department==="看護学科") return 4; return 4; }
function gradeAt(p, acadY){
  if(!p || !p.enrollmentYear || acadY==null) return null;
  if(acadY < p.enrollmentYear) return "入学前";
  const raw = acadY - p.enrollmentYear + (p.entryGrade || 1);
  const reps = (p.repeatedGrades||[]).filter(g=>g<raw).length;
  const g = Math.max(1, raw - reps);
  if(g > programYears(p)) return "卒業";
  return g + "年";
}
function personStatus(p){
  const na = nowAcad();
  if(p.graduationYear){ const diff = na - p.graduationYear; if(diff>=1) return p.graduationYear + "年度卒業／卒業" + diff + "年目"; }
  if(!p.enrollmentYear) return "入学年度未登録";
  const g = gradeAt(p, na);
  if(g==="卒業"){
    const estGrad = p.enrollmentYear + programYears(p) - (p.entryGrade || 1) + (p.repeatedGrades||[]).length;
    return "卒業" + Math.max(1, na - estGrad) + "年目";
  }
  return g || "";
}
const COHORT_BASE_YEAR = 1974; /* 2024年度入学 = 50期 */
function cohortText(p){
  if(!p || !p.enrollmentYear) return "";
  const base = p.enrollmentYear - ((p.entryGrade || 1) - 1) - COHORT_BASE_YEAR;
  const n = (p.repeatedGrades || []).length;
  const out = [];
  for(let i = 0; i <= n; i++) out.push((base + i) + "期");
  return out.join("・");
}
function bandRefDate(band){
  let best = null;
  (band.appearances||[]).forEach(a=>{ const ev = eventById(a.eventId); if(ev && ev.startDate && (!best || ev.startDate < best)) best = ev.startDate; });
  if(best) return best;
  const m = String(band.period||"").match(/(\d{4})年/);
  if(m) return m[1] + "-04-01";
  return null;
}
function memberGradeText(band, member){
  if(member.gradeOverride) return member.gradeOverride;
  const p = personByName(member.name);
  if(!p) return "";
  const rd = bandRefDate(band);
  if(!rd) return "";
  const g = gradeAt(p, acadYearOf(rd));
  return g ? "当時" + g : "";
}
function effArtist(band, song){ return song.artist || (band.bandType==="copy" ? (band.copyArtist||"") : ""); }
function songKey(band, song){ return song.title + "\u0001" + effArtist(band, song); }
const STATUS_LABEL = { active:"活動中", ended:"解散・終了", planning:"構想中" };
const FIXED_PARTS = ["ドラム","ボーカル","ギター","ベース","キーボード"];

/* ---------- バンド一覧・詳細 ---------- */
function bandMatchesQuery(b, q){
  if(!q) return true;
  const hay = [ b.name, b.copyArtist||"", b.period||"", (b.myParts||[]).join(" "),
    (b.members||[]).map(m=>m.name).join(" "),
    (b.songs||[]).map(s=>s.title+" "+(s.artist||"")).join(" "),
    (b.appearances||[]).map(a=>(a.songs||[]).map(s=>s.title+" "+(s.artist||"")).join(" ")).join(" ")
  ].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w=>hay.includes(w));
}
function bandListHTML(){
  const chips = [["all","すべて"],["active","活動中"],["ended","解散・終了"],["planning","構想中"]]
    .map(c=>`<button class="btn small ${view.statusFilter===c[0]?"primary":""}" onclick="App.setStatusFilter('${c[0]}')">${c[1]}</button>`).join("");
  let h = `<div class="row"><input type="search" class="grow" placeholder="バンド名・コピー元・メンバー・曲名で検索" value="${esc(view.query)}" oninput="App.setQuery(this.value)"><button class="btn primary" onclick="App.newBand()">＋ バンド追加</button></div>`;
  h += `<div class="row" style="margin:8px 0">${chips}</div>`;
  h += `<div class="row" style="margin:0 0 12px"><span class="meta">並び替え：</span><select style="width:auto;margin:0" onchange="App.setBandSort(this.value)">${[["updated","最近更新した順"],["name","名前順"],["nextLive","次のライブが近い順"],["members","メンバー数順"],["songs","曲数順"]].map(o=>`<option value="${o[0]}" ${view.bandSort===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></div><div id="bandResults">${bandResultsHTML()}</div>`;
  return h;
}
function bandResultsHTML(){
  const bands = DB.bands.filter(b=> (view.statusFilter==="all" || b.status===view.statusFilter) && bandMatchesQuery(b, view.query));
  const songCountOf = b => (b.songs||[]).length + (b.appearances||[]).reduce((n,a)=>n+(a.songs||[]).length,0);
  const nextLiveKey = b => { const t = new Date(); const today = t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); const ds = (b.appearances||[]).map(a=>{ const ev = eventById(a.eventId); return ev ? ev.startDate : ""; }).filter(d=>d && d >= today).sort(); return ds.length ? ds[0] : "9999-12-31"; };
  const bs = view.bandSort || "updated";
  if(bs==="name") bands.sort((a,b)=> a.name.localeCompare(b.name,"ja"));
  else if(bs==="members") bands.sort((a,b)=> (b.members||[]).length - (a.members||[]).length || a.name.localeCompare(b.name,"ja"));
  else if(bs==="songs") bands.sort((a,b)=> songCountOf(b) - songCountOf(a) || a.name.localeCompare(b.name,"ja"));
  else if(bs==="nextLive") bands.sort((a,b)=> nextLiveKey(a).localeCompare(nextLiveKey(b)) || a.name.localeCompare(b.name,"ja"));
  else bands.sort((a,b)=> String(b.updatedAt||"").localeCompare(String(a.updatedAt||"")));
  if(!bands.length) return `<div class="empty">該当するバンドがありません</div>`;
  return `<div class="meta" style="margin-bottom:8px">${bands.length}件</div>` + bands.map(b=>{
    const songCount = (b.songs||[]).length + (b.appearances||[]).reduce((n,a)=>n+(a.songs||[]).length,0);
    return `<div class="card clickable" onclick="App.openBand(${b.id})"><h3>${esc(b.name)}</h3>
      <div><span class="chip accent">${b.bandType==="copy"?"コピバン":"オムニバス"}</span>${b.copyArtist?`<span class="chip">${esc(b.copyArtist)}</span>`:""}<span class="chip">${STATUS_LABEL[b.status]||b.status}</span>${b.period?`<span class="chip">${esc(b.period)}</span>`:""}</div>
      <div class="meta">メンバー：${(b.members||[]).map(m=>esc(m.name)).join("、") || "—"}<br>自分のパート：${(b.myParts||[]).join("、") || "—"}／曲 ${songCount}</div></div>`;
  }).join("");
}
function memberBadges(m){
  let s = "";
  if(m.joinType==="mid") s += `<span class="badge">途中加入${m.joinNote?"（"+esc(m.joinNote)+"）":""}</span>`;
  if(m.replacedName) s += `<span class="badge">${esc(m.replacedName)}と入れ替わり</span>`;
  if(m.hasLeft) s += `<span class="badge">離脱${m.leftNote?"（"+esc(m.leftNote)+"）":""}</span>`;
  return s;
}
function linksHTML(links){
  if(!links || !links.length) return "";
  return `<ul class="plain">` + links.map(l=>`<li>🎬 <a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label || l.url)}</a></li>`).join("") + `</ul>`;
}
function bandDetailHTML(b){
  if(!b) return `<div class="empty">バンドが見つかりません</div>`;
  let h = `<div class="backbar"><button class="btn" onclick="App.backToBands()">← バンド一覧</button></div>`;
  h += `<div class="card"><h3>${esc(b.name)}</h3>
    <div><span class="chip accent">${b.bandType==="copy"?"コピバン":"オムニバス"}</span>${b.copyArtist?`<span class="chip">${esc(b.copyArtist)}</span>`:""}<span class="chip">${STATUS_LABEL[b.status]||b.status}</span>${b.period?`<span class="chip">${esc(b.period)}</span>`:""}</div>
    <div class="meta">自分のパート：${(b.myParts||[]).join("、") || "—"}</div>
    ${b.memo?`<div style="margin-top:6px">${esc(b.memo)}</div>`:""}</div>`;
  h += `<h2 class="sec">メンバー</h2><div class="card"><ul class="plain">` +
    (b.members||[]).map(m=>{
      const gt = memberGradeText(b, m);
      return `<li><strong>${esc(m.name)}</strong>${memberBadges(m)}<br><span class="meta">${(m.parts||[]).join("、") || "パート未設定"}${gt?"／"+esc(gt):""}</span></li>`;
    }).join("") + `</ul></div>`;
  if((b.appearances||[]).length){
    h += `<h2 class="sec">出演ライブとセットリスト</h2>`;
    h += b.appearances.map(a=>{
      const ev = eventById(a.eventId);
      return `<div class="card"><h3>${ev?esc(ev.name):"（ライブ不明）"}</h3>
        <div class="meta">${ev?esc(ev.startDate)+(ev.endDate&&ev.endDate!==ev.startDate?" 〜 "+esc(ev.endDate):""):""}</div>
        <ul class="plain">${(a.songs||[]).map(s=>`<li>${esc(s.title)}${s.artist?`<span class="songnote">${esc(s.artist)}</span>`:""}${s.note?`<span class="songnote">${esc(s.note)}</span>`:""}</li>`).join("")}</ul>
        ${linksHTML(a.links)}</div>`;
    }).join("");
  }
  if((b.songs||[]).length){
    h += `<h2 class="sec">曲リスト（ライブ以外）</h2><div class="card"><ul class="plain">` +
      b.songs.map(s=>`<li>${esc(s.title)}${s.artist?`<span class="songnote">${esc(s.artist)}</span>`:""}${s.note?`<span class="songnote">${esc(s.note)}</span>`:""}</li>`).join("") + `</ul></div>`;
  }
  if((b.links||[]).length){ h += `<h2 class="sec">動画・写真リンク（ライブ以外）</h2><div class="card">${linksHTML(b.links)}</div>`; }
  h += `<div class="actionbar"><button class="btn primary" onclick="App.editBand(${b.id})">編集する</button>
    <button class="btn" onclick="App.duplicateBand(${b.id})">複製</button>
    <button class="btn danger" onclick="App.deleteBand(${b.id})">削除</button></div>`;
  return h;
}

function peopleListHTML(){

  return h;
}
function peopleResultsHTML(){
  const q = view.peopleQuery.trim().toLowerCase();
  const list = DB.people.filter(p=>!q || p.name.toLowerCase().includes(q));
  const pplBandCount = p => DB.bands.filter(b=>(b.members||[]).some(m=>m.name===p.name)).length;
  const ps = view.peopleSort || "grade";
  if(ps==="name") list.sort((a,b)=> a.name.localeCompare(b.name,"ja"));
  else if(ps==="bands") list.sort((a,b)=> pplBandCount(b) - pplBandCount(a) || a.name.localeCompare(b.name,"ja"));
  else list.sort((a,b)=> (a.enrollmentYear||9999)-(b.enrollmentYear||9999) || a.name.localeCompare(b.name,"ja"));
  if(!list.length) return `<div class="empty">該当するメンバーがいません</div>`;
  return list.map(p=>{
    const bandCount = DB.bands.filter(b=>(b.members||[]).some(m=>m.name===p.name)).length;
    return `<div class="card clickable" onclick="App.openPerson(${p.id})"><h3>${esc(p.name)}</h3>
      <div><span class="chip accent">${esc(personStatus(p))}</span><span class="chip">${esc(p.department||"学科未登録")}</span><span class="chip">${p.enrollmentYear?p.enrollmentYear+"年入学":"入学年度未登録"}</span>${cohortText(p)?`<span class="chip">${esc(cohortText(p))}</span>`:""}</div>
      <div class="meta">参加バンド ${bandCount}件</div></div>`;
  }).join("");
}
function personDetailHTML(p){
  if(!p) return `<div class="empty">メンバーが見つかりません</div>`;
  let h = `<div class="backbar"><button class="btn" onclick="App.backToPeople()">← メンバー一覧</button></div>`;
  h += `<div class="card"><h3>${esc(p.name)}</h3>
    <div><span class="chip accent">${esc(personStatus(p))}</span><span class="chip">${esc(p.gender||"")}</span><span class="chip">${esc(p.department||"学科未登録")}</span></div>
    <div class="meta">入学年度：${p.enrollmentYear||"未登録"}${p.entryGrade&&p.entryGrade>1?"（"+p.entryGrade+"年次編入）":""}${cohortText(p)?"／"+esc(cohortText(p)):""}${p.graduationYear?"／卒業年度："+p.graduationYear+"年度":""}${(p.repeatedGrades&&p.repeatedGrades.length)?"／留年："+p.repeatedGrades.join("・")+"年":""}</div>
    ${p.joinedYear?`<div class="notice" style="margin-top:8px">${p.joinedYear}年度に途中入部${p.joinedGrade?"（当時"+p.joinedGrade+"年）":""}${p.joinedNote?"・"+esc(p.joinedNote):""}</div>`:""}
  </div>`;
  const bands = DB.bands.filter(b=>(b.members||[]).some(m=>m.name===p.name));
  h += `<h2 class="sec">参加バンド（${bands.length}）</h2>`;
  h += bands.length ? bands.map(b=>{
    const m = b.members.find(x=>x.name===p.name);
    const gt = memberGradeText(b, m);
    return `<div class="card clickable" onclick="App.openBand(${b.id})"><h3>${esc(b.name)}</h3>
      <div class="meta">${(m.parts||[]).join("、") || "パート未設定"}${gt?"／"+esc(gt):""}${m.joinType==="mid"?"／途中加入":""}${m.hasLeft?"／離脱済み":""}</div></div>`;
  }).join("") : `<div class="empty">参加バンドはまだありません</div>`;
  h += `<div class="actionbar"><button class="btn primary" onclick="App.editPerson(${p.id})">プロフィールを編集</button>
    <button class="btn danger" onclick="App.deletePerson(${p.id})">プロフィールを削除</button></div>`;
  return h;
}

/* ---------- 曲タブ ---------- */
function collectSongs(){
  const map = new Map();
  DB.bands.forEach(b=>{
    const add = (s, evName, evDate)=>{
      const key = songKey(b, s);
      if(!map.has(key)) map.set(key, { title:s.title, artist:effArtist(b,s), occs:[] });
      map.get(key).occs.push({ band:b, eventName:evName, date:evDate||"" });
    };
    (b.appearances||[]).forEach(a=>{ const ev = eventById(a.eventId); (a.songs||[]).forEach(s=>add(s, ev?ev.name:"（ライブ不明）", ev?ev.startDate:"")); });
    (b.songs||[]).forEach(s=>add(s, "ライブ以外", ""));
  });
  return [...map.values()];
}

function songResultsHTML(){
  const q = view.songQuery.trim().toLowerCase();
  let list = collectSongs();
  if(q) list = list.filter(s=> (s.title+" "+s.artist+" "+s.occs.map(o=>o.band.name).join(" ")).toLowerCase().includes(q));
  const latestDate = s => s.occs.reduce((mx,o)=> (o.date||"") > mx ? o.date : mx, "");
  const ss = view.songSort || "count";
  if(ss==="title") list.sort((a,b)=> a.title.localeCompare(b.title,"ja"));
  else if(ss==="artist") list.sort((a,b)=> (a.artist||"").localeCompare(b.artist||"","ja") || a.title.localeCompare(b.title,"ja"));
  else if(ss==="recent") list.sort((a,b)=> latestDate(b).localeCompare(latestDate(a)) || b.occs.length - a.occs.length || a.title.localeCompare(b.title,"ja"));
  else list.sort((a,b)=> b.occs.length - a.occs.length || a.title.localeCompare(b.title,"ja"));
  if(!list.length) return `<div class="empty">該当する曲がありません</div>`;
  return `<div class="meta" style="margin:6px 0 10px">${list.length}曲</div>` + list.map(s=>`<div class="card"><h3>${esc(s.title)}${s.occs.length>1?`<span class="badge">通算${s.occs.length}回</span>`:""}</h3>

function downloadFile(name, text, type){
  const blob = new Blob([text], { type: type || "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}
function dateStamp(){ const d=new Date(); const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate()); }

function buildShareData(partnerName, selfName){
  const partner = DB.people.find(p=>p.name===partnerName); if(!partner) return null;
  const bands = []; const eventIds = new Set(); const peopleNames = new Set();
  DB.bands.forEach(b=>{
    const pm = (b.members||[]).find(m=>m.name===partnerName); if(!pm) return;
    const nb = clone(b);
    nb.myParts = [...(pm.parts||[])];
    nb.members = (b.members||[]).filter(m=>m.name!==partnerName).map(m=>clone(m));
    if((b.myParts||[]).length) nb.members.push({ name:selfName, parts:[...(b.myParts||[])], gradeOverride:"", joinType:"founding", joinNote:"", hasLeft:false, leftNote:"", replacedName:"" });
    nb.members.forEach(m=>peopleNames.add(m.name));
    (nb.appearances||[]).forEach(a=>eventIds.add(a.eventId));
    bands.push(nb);
  });
  const people = DB.people.filter(p=>peopleNames.has(p.name)).map(p=>clone(p));
  if(!people.some(p=>p.name===selfName)) people.push({ id:0, name:selfName, gender:"", department:"", programYears:null, enrollmentYear:null, entryGrade:1, graduationYear:null, repeatedGrades:[], joinedYear:null, joinedGrade:null, joinedNote:"" });
  const events = DB.events.filter(e=>eventIds.has(e.id)).map(e=>clone(e));
  return { partial:true, sharedFrom:selfName, sharedTo:partnerName, people, events, bands };
}
function mergeSharedData(d){
  let addedPeople = 0, addedEvents = 0, addedBands = 0, updatedBands = 0;
  (d.people||[]).forEach(p=>{ if(p.name !== d.sharedTo && !DB.people.some(x=>x.name===p.name)){ const np = clone(p); np.id = nextId("people"); DB.people.push(np); addedPeople++; } });
  const evMap = {};
  (d.events||[]).forEach(ev=>{
    const ex = DB.events.find(x=>x.name===ev.name && x.startDate===ev.startDate);
    if(ex){ evMap[ev.id] = ex.id; } else { const ne = clone(ev); ne.id = nextId("events"); DB.events.push(ne); evMap[ev.id] = ne.id; addedEvents++; }
  });
  (d.bands||[]).forEach(b=>{
    const nb = clone(b);
    (nb.appearances||[]).forEach(a=>{ if(evMap[a.eventId] != null) a.eventId = evMap[a.eventId]; });
    const ex = DB.bands.find(x=>x.name===nb.name);
    if(ex){ nb.id = ex.id; DB.bands[DB.bands.findIndex(x=>x.id===ex.id)] = nb; updatedBands++; }
    else { nb.id = nextId("bands"); DB.bands.push(nb); addedBands++; }
  });
  return { addedPeople, addedEvents, addedBands, updatedBands };
}

function formatSongs(songs){ return (songs||[]).map(s=>[s.title||"", s.artist||"", s.note||""].join("／").replace(/／+$/,"")).join("\n"); }
function parseSongs(text){
  return String(text||"").split(/\n/).map(l=>l.trim()).filter(Boolean).map(line=>{
    const parts = line.split("／").map(x=>x.trim());
    if(parts.length===1){
      const m = parts[0].match(/^(.*?)[（(]([^（）()]*)[）)]\s*$/);
      if(m) return { title:m[1].trim(), artist:m[2].trim(), note:"" };
      return { title:parts[0], artist:"", note:"" };
    }
    return { title:parts[0], artist:parts[1]||"", note:parts.slice(2).join("／") };
  }).filter(s=>s.title);
}

  <div class="actionbar"><button class="btn primary" onclick="App.savePerson()">保存する</button><button class="btn" onclick="App.cancelPersonEdit()">キャンセル</button></div>`;
}

/* ---------- ライブ編集 ---------- */
let draftEvent = null, editingEventId = null;
function eventEditorHTML(){
  const d = draftEvent;
  return `<div class="backbar"><button class="btn" onclick="App.cancelEventEdit()">← 戻る（保存しない）</button></div>
  <div class="card">
    <label class="flabel">ライブ名（必須）</label><input type="text" id="ef-name" value="${esc(d.name||"")}">
    <div class="grid2">
      <div><label class="flabel">開始日</label><input type="date" id="ef-start" value="${esc(d.startDate||"")}"></div>
      <div><label class="flabel">終了日</label><input type="date" id="ef-end" value="${esc(d.endDate||"")}"></div>
    </div>
  </div>
  <div class="actionbar"><button class="btn primary" onclick="App.saveEvent()">保存する</button><button class="btn" onclick="App.cancelEventEdit()">キャンセル</button></div>`;
}

/* ---------- 操作 ---------- */
function showEditor(html){ document.getElementById("app").innerHTML = html; window.scrollTo(0,0); }
const App = {
  goTab(tab){ view.tab = tab; view.bandId = null; view.personId = null; view.eventId = null; render(); },
  setQuery(v){ view.query = v; const el = document.getElementById("bandResults"); if(el) el.innerHTML = bandResultsHTML(); },
  setBandSort(v){ view.bandSort = v; const el = document.getElementById("bandResults"); if(el) el.innerHTML = bandResultsHTML(); },
  setPeopleSort(v){ view.peopleSort = v; const el = document.getElementById("peopleResults"); if(el) el.innerHTML = peopleResultsHTML(); },
  setSongSort(v){ view.songSort = v; const el = document.getElementById("songResults"); if(el) el.innerHTML = songResultsHTML(); },
  setStatusFilter(f){ view.statusFilter = f; render(); },
  openBand(id){ view.tab = "bands"; view.bandId = id; render(); },
  backToBands(){ view.bandId = null; render(); },
  newBand(){ editingBandId = null; draftBand = prepareDraft({ name:"", bandType:"copy", copyArtist:"", status:"active", period:"", myParts:[], memo:"", links:[], songs:[], members:[], appearances:[] }); showEditor(bandEditorHTML()); },
  editBand(id){ const b = bandById(id); if(!b) return; editingBandId = id; draftBand = prepareDraft(b); showEditor(bandEditorHTML()); },
  duplicateBand(id){ const b = bandById(id); if(!b) return; const c = clone(b); delete c.songsText; (c.appearances||[]).forEach(a=>delete a.songsText); c.id = nextId("bands"); c.name = b.name + "（コピー）"; c.updatedAt = new Date().toISOString(); DB.bands.push(c); saveDB(); App.openBand(c.id); },
  deleteBand(id){ const b = bandById(id); if(!b) return; if(!confirm("バンド「" + b.name + "」を削除しますか？")) return; DB.bands = DB.bands.filter(x=>x.id!==id); saveDB(); view.bandId = null; render(); },
  cancelBandEdit(){ draftBand = null; render(); },
  addMemberRow(){ syncBandDraft(); draftBand.members.push({ name:"", parts:[], gradeOverride:"", joinType:"founding", joinNote:"", hasLeft:false, leftNote:"", replacedName:"" }); document.getElementById("membersBox").innerHTML = memberRowsHTML(); },
  removeMemberRow(i){ syncBandDraft(); draftBand.members.splice(i,1); document.getElementById("membersBox").innerHTML = memberRowsHTML(); },
  bulkAddMembers(){ syncBandDraft(); const text = document.getElementById("bf-bulk").value;
    text.split(/\n/).map(l=>l.trim()).filter(Boolean).forEach(line=>{
      const m = line.match(/^(.*?)[（(]([^（）()]*)[）)]\s*$/);
      const name = (m ? m[1] : line).trim(); if(!name) return;
      const parts = m ? m[2].split(/[、,，・]/).map(x=>x.trim()).filter(Boolean) : [];
      draftBand.members.push({ name, parts, gradeOverride:"", joinType:"founding", joinNote:"", hasLeft:false, leftNote:"", replacedName:"" });
    });
    document.getElementById("bf-bulk").value = ""; document.getElementById("membersBox").innerHTML = memberRowsHTML(); },
  addAppearance(){ syncBandDraft(); draftBand.appearances.push({ eventId: DB.events.length ? DB.events[DB.events.length-1].id : null, songsText:"", links:[] }); document.getElementById("appsBox").innerHTML = appBlocksHTML(); },
  removeAppearance(j){ syncBandDraft(); draftBand.appearances.splice(j,1); document.getElementById("appsBox").innerHTML = appBlocksHTML(); },
  addAppLink(j){ syncBandDraft(); (draftBand.appearances[j].links = draftBand.appearances[j].links || []).push({ label:"", url:"" }); document.getElementById("appsBox").innerHTML = appBlocksHTML(); },
  addBandLink(){ syncBandDraft(); draftBand.links.push({ label:"", url:"" }); document.getElementById("linksBox").innerHTML = linkRowsHTML(draftBand.links, "bl"); },
  removeLinkRow(btn, cls){ btn.closest(".row").remove(); },
  saveBand(){
    syncBandDraft();
    const d = draftBand;
    if(!d.name.trim()){ alert("バンド名を入力してください"); return; }
    const band = { name: d.name.trim(), bandType: d.bandType, copyArtist: d.copyArtist.trim(), status: d.status, period: d.period.trim(),
      myParts: d.myParts, memo: d.memo, songs: parseSongs(d.songsText),
      members: d.members.filter(m=>m.name),
      appearances: d.appearances.filter(a=>a.eventId).map(a=>({ eventId: a.eventId, songs: parseSongs(a.songsText), links: (a.links||[]).filter(l=>l.url) })),
      links: (d.links||[]).filter(l=>l.url), updatedAt: new Date().toISOString() };
    if(editingBandId){ band.id = editingBandId; const i = DB.bands.findIndex(x=>x.id===editingBandId); if(i>=0) DB.bands[i] = band; }
    else { band.id = nextId("bands"); DB.bands.push(band); }
    saveDB(); draftBand = null; view.tab = "bands"; view.bandId = band.id; render();
  },
  setPeopleQuery(v){ view.peopleQuery = v; const el = document.getElementById("peopleResults"); if(el) el.innerHTML = peopleResultsHTML(); },
  openPerson(id){ view.tab = "people"; view.personId = id; render(); },
  backToPeople(){ view.personId = null; render(); },
  newPerson(){ editingPersonId = null; draftPerson = { name:"", gender:"", department:"医学科", programYears:null, enrollmentYear:null, entryGrade:1, graduationYear:null, repeatedGrades:[], joinedYear:null, joinedGrade:null, joinedNote:"" }; showEditor(personEditorHTML()); },
  editPerson(id){ const p = DB.people.find(x=>x.id===id); if(!p) return; editingPersonId = id; draftPerson = clone(p); showEditor(personEditorHTML()); },
  deletePerson(id){ const p = DB.people.find(x=>x.id===id); if(!p) return; if(!confirm("「" + p.name + "」のプロフィールを削除しますか？（バンド側のメンバー記録は残ります）")) return; DB.people = DB.people.filter(x=>x.id!==id); saveDB(); view.personId = null; render(); },
  cancelPersonEdit(){ draftPerson = null; render(); },
  savePerson(){
    const name = document.getElementById("pf-name").value.trim();
    if(!name){ alert("名前を入力してください"); return; }
    if(DB.people.some(p=>p.name===name && p.id!==editingPersonId)){ alert("同じ名前のメンバーが既に登録されています"); return; }
    const num = id => { const v = document.getElementById(id).value; return v==="" ? null : +v; };
    const dept = document.getElementById("pf-dept").value;
    const person = { name, gender: document.getElementById("pf-gender").value, department: dept,
      programYears: dept==="その他" ? num("pf-prog") : null,
      enrollmentYear: num("pf-enroll"), entryGrade: num("pf-entry") || 1, graduationYear: num("pf-grad"),
      repeatedGrades: document.getElementById("pf-rep").value.split(/[、,，\s]+/).filter(Boolean).map(x=>parseInt(x,10)).filter(n=>n>=1 && n<=12),
      joinedYear: num("pf-joinyear"), joinedGrade: num("pf-joingrade"), joinedNote: document.getElementById("pf-joinnote").value.trim() };
    if(editingPersonId){
      const old = DB.people.find(p=>p.id===editingPersonId);
      if(old && old.name !== name){ DB.bands.forEach(b=>{ (b.members||[]).forEach(m=>{ if(m.name===old.name) m.name = name; if(m.replacedName===old.name) m.replacedName = name; }); }); }
      person.id = editingPersonId; const i = DB.people.findIndex(p=>p.id===editingPersonId); if(i>=0) DB.people[i] = person;
    } else { person.id = nextId("people"); DB.people.push(person); }
    saveDB(); draftPerson = null; view.tab = "people"; view.personId = person.id; render();
  },
  openEvent(id){ view.tab = "events"; view.eventId = id; render(); },
  backToEvents(){ view.eventId = null; render(); },
  newEvent(){ editingEventId = null; draftEvent = { name:"", startDate:"", endDate:"" }; showEditor(eventEditorHTML()); },
  editEvent(id){ const ev = eventById(id); if(!ev) return; editingEventId = id; draftEvent = clone(ev); showEditor(eventEditorHTML()); },
  deleteEvent(id){ const ev = eventById(id); if(!ev) return; if(!confirm("ライブ「" + ev.name + "」を削除しますか？（バンド側の出演記録も外れます）")) return;
    DB.events = DB.events.filter(x=>x.id!==id); DB.bands.forEach(b=>{ b.appearances = (b.appearances||[]).filter(a=>a.eventId!==id); }); saveDB(); view.eventId = null; render(); },
  cancelEventEdit(){ draftEvent = null; render(); },
  saveEvent(){
    const name = document.getElementById("ef-name").value.trim();
    if(!name){ alert("ライブ名を入力してください"); return; }
    const start = document.getElementById("ef-start").value, end = document.getElementById("ef-end").value || start;
    const ev = { name, startDate: start, endDate: end };
    if(editingEventId){ ev.id = editingEventId; const i = DB.events.findIndex(x=>x.id===editingEventId); if(i>=0) DB.events[i] = ev; }
    else { ev.id = nextId("events"); DB.events.push(ev); }
    saveDB(); draftEvent = null; view.tab = "events"; view.eventId = ev.id; render();
  },
  setSongQuery(v){ view.songQuery = v; const el = document.getElementById("songResults"); if(el) el.innerHTML = songResultsHTML(); },
  exportJSON(){ downloadFile("band-archive-" + dateStamp() + ".json", JSON.stringify(DB, null, 2), "application/json"); },
  setOwnerName(v){ const s = loadSettings(); s.ownerName = String(v||"").trim(); try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }catch(e){} },
  exportShareJSON(){
    const selfName = (document.getElementById("share-self").value || "").trim();
    const partnerName = document.getElementById("share-partner").value;
    if(!selfName){ alert("自分の名前を入力してください"); return; }
    if(!partnerName){ alert("共有相手を選んでください"); return; }
    this.setOwnerName(selfName);
    const d = buildShareData(partnerName, selfName);
    if(!d || !d.bands.length){ alert("その人が入っているバンドがありません"); return; }
    downloadFile("band-archive-share-" + partnerName + "-" + dateStamp() + ".json", JSON.stringify(d, null, 2), "application/json");
  },
  importJSON(input){
    const file = input.files && input.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = () => { try{
        const d = JSON.parse(reader.result);
        if(!d || !Array.isArray(d.people) || !Array.isArray(d.events) || !Array.isArray(d.bands)) throw new Error("bad format");
        if(d.partial){ const r = mergeSharedData(d); saveDB(); view.tab = "bands"; view.bandId = null; render(); alert("共有データを取り込みました（バンド" + (r.addedBands + r.updatedBands) + "件／メンバー" + r.addedPeople + "人追加／ライブ" + r.addedEvents + "件追加）"); return; }
        DB = d; saveDB(); view = { tab:"bands", bandId:null, personId:null, eventId:null, query:"", statusFilter:"all", songQuery:"", peopleQuery:"", bandSort:"updated", peopleSort:"grade", songSort:"count" }; render(); alert("読み込みました");
      }catch(e){ alert("読み込めませんでした（ファイル形式が違います）"); } };
    reader.readAsText(file); input.value = "";
  },
  exportText(){
    const lines = [];
    [...DB.bands].sort((a,b)=>String(b.updatedAt||"").localeCompare(String(a.updatedAt||""))).forEach(b=>{
      lines.push("■ " + b.name + "（" + (b.bandType==="copy"?"コピバン":"オムニバス") + (b.copyArtist?"／"+b.copyArtist:"") + "）");
      lines.push("状態：" + (STATUS_LABEL[b.status]||b.status) + "　期間：" + (b.period||"") + "　自分のパート：" + (b.myParts||[]).join("、"));
      lines.push("メンバー：" + (b.members||[]).map(m=>m.name + (m.parts&&m.parts.length?"（"+m.parts.join("、")+"）":"")).join("、"));
      (b.appearances||[]).forEach(a=>{ const ev = eventById(a.eventId); lines.push("出演：" + (ev?ev.name:"") + "（" + (ev?ev.startDate:"") + "）");
        (a.songs||[]).forEach(s=>lines.push("　・" + s.title + (s.artist?"／"+s.artist:"") + (s.note?"（"+s.note+"）":"")));
        (a.links||[]).forEach(l=>lines.push("　リンク：" + l.url)); });
      (b.songs||[]).forEach(s=>lines.push("曲：" + s.title + (s.artist?"／"+s.artist:"")));
      if(b.memo) lines.push("メモ：" + b.memo);
      lines.push("");
    });
    downloadFile("band-archive-" + dateStamp() + ".txt", lines.join("\n"));
  },
  exportCSV(){
    const q = v => '"' + String(v==null?"":v).replace(/"/g,'""') + '"';
    const rows = [["バンド名","種別","コピー元","状態","活動期間","自分のパート","メンバー","曲数"].join(",")];
    DB.bands.forEach(b=>{
      const n = (b.songs||[]).length + (b.appearances||[]).reduce((s,a)=>s+(a.songs||[]).length,0);
      rows.push([b.name, b.bandType==="copy"?"コピバン":"オムニバス", b.copyArtist||"", STATUS_LABEL[b.status]||b.status, b.period||"", (b.myParts||[]).join("、"), (b.members||[]).map(m=>m.name).join("、"), n].map(q).join(","));
    });
    downloadFile("band-archive-" + dateStamp() + ".csv", "\ufeff" + rows.join("\n"), "text/csv;charset=utf-8");
  },
  resetAll(){ if(!confirm("初期データに戻しますか？今の変更は失われます。")) return; if(!confirm("本当に戻しますか？")) return;
    DB = { people: clone(SEED_PEOPLE), events: clone(SEED_EVENTS), bands: clone(SEED_BANDS) }; saveDB(); view.tab = "bands"; view.bandId = null; render(); alert("初期データに戻しました"); }
};
window.App = App;
render();
</script>
</body>
</html>
